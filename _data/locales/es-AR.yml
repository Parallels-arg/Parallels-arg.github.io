  license:
    template: Esta entrada está licenciada bajo :LICENSE_NAME por el autor.
    name: CC BY-NC 4.0
    link: https://creativecommons.org/licenses/by-nc/4.0/deed.es

  # Displayed in the footer
  brief: Algunos derechos reservados.
  verbose: >-
    Salvo que se indique explícitamente, las entradas de este blog están licenciadas
    bajo la licencia Creative Commons Atribución-NoComercial 4.0 Internacional (CC BY-NC 4.0) por el autor.

meta: Hecho con :PLATFORM usando el tema :THEME

not_found:
  statement: Esta página no existe o se movió.

notification:
  update_found: Hay contenido nuevo
  update: Actualizar

theme:
  light: Claro
  dark: Oscuro
  system: Sistema

# ----- Posts related labels -----

post:
  written_by: Por
  posted: Publicado
  updated: Actualizado
  words: palabras
  pageview_measure: visitas
  read_time:
    unit: min
    prompt: " de lectura"
  edit: Editar esta entrada
