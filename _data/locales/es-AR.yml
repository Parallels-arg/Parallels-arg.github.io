# The layout text of site

# ----- Commons label -----

layout:
  post: Entrada
  category: Categoría
  tag: Etiqueta

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Inicio
  categories: Categorías
  tags: Etiquetas
  archives: Archivo
  about: Sobre mí

# the text displayed in the search bar & search results
search:
  hint: Buscar
  cancel: Cancelar
  no_results: Sin resultados. Probá con otra palabra o mirá las categorías.

panel:
  lastmod: Actualizado recientemente
