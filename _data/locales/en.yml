# Copied from jekyll-theme-chirpy v7.6.0 to change the content license to CC BY-NC 4.0
# and the search empty state. The `custom` block at the end is used by this site's own templates.
# The layout text of site

# ----- Commons label -----

layout:
  post: Post
  category: Category
  tag: Tag

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Home
  categories: Categories
  tags: Tags
  archives: Archives
  about: About

# the text displayed in the search bar & search results
search:
  hint: search
  cancel: Cancel
  no_results: No results. Try another word, or browse the categories.

panel:
  lastmod: Recently Updated
  trending_tags: Trending Tags
  toc: Contents

copyright:
  # Shown at the bottom of the post
  license:
    template: This post is licensed under :LICENSE_NAME by the author.
    name: CC BY-NC 4.0
    link: https://creativecommons.org/licenses/by-nc/4.0/

  # Displayed in the footer
  brief: Some rights reserved.
  verbose: >-
    Except where otherwise noted, the blog posts on this site are licensed
    under the Creative Commons Attribution-NonCommercial 4.0 International (CC BY-NC 4.0) License by the author.

meta: Using the :THEME theme for :PLATFORM.

not_found:
  statement: Sorry, we've misplaced that URL or it's pointing to something that doesn't exist.

notification:
  update_found: New content available
  update: Update

theme:
  light: Light
  dark: Dark
  system: System

# ----- Posts related labels -----

post:
  written_by: By
  posted: Posted
  updated: Updated
  words: words
  pageview_measure: views
  read_time:
    unit: min
    prompt: read
  edit: Edit this post
  relate_posts: Further Reading
  share: Share
  button:
    next: Newer
    previous: Older
    copy_code:
      succeed: Copied!
    share_link:
      title: Copy link
      succeed: Link copied successfully!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: category
    plural: categories
  post_measure:
    singular: post
    plural: posts

# ----- Custom labels (this site's templates, not Chirpy) -----

custom:
  skip: Skip to content
  intro: >-
    Software developer in Buenos Aires, getting back into offensive security. I write up retired
    HackTheBox and TryHackMe machines, crackmes and reversing, and keep notes on what I learn.
  about: About me
  latest: Latest posts
  menu: Menu
  search: Search
  close: Close
  theme: Theme
  back_to_top: Back to top
  main: Main content
  post_nav: More posts
  sidebar: Sidebar
  panel: Side panel
  topbar: Top bar
  breadcrumb: Breadcrumb
  footer: Site info
  result: result
  results: results
